[project]
name = "labelmaker"
version = "0.1.0"
description = "Simple webinterface for printing labels on my hobby shelves and boxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.10.0",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
