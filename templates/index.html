<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label Maker</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-base-color="{{ base_color }}" data-text-color="{{ text_color }}">

<div id="sidebar">
  <h1>Label Maker</h1>

  <div class="field">
    <label>System</label>
    <select id="system-select"></select>
  </div>
  <div class="field">
    <label>Box type</label>
    <select id="box-select"></select>
  </div>
  <div class="field" id="style-field">
    <label>Label style</label>
    <select id="style-select"></select>
  </div>

  <hr class="divider">
  <h2>Colors</h2>
  <div class="params-grid">
    <div class="field">
      <label>Base</label>
      <input type="color" id="base-color" value="{{ base_color }}" />
    </div>
    <div class="field">
      <label>Text / accent</label>
      <div style="display:flex; gap:6px;">
        <input type="color" id="text-color" value="{{ text_color }}" style="flex:1;" />
        <button type="button" class="btn-auto" id="auto-color-btn">Auto</button>
      </div>
    </div>
  </div>

  <hr class="divider">
  <h2>Label text</h2>
  <div class="field">
    <textarea id="text" rows="2">Resistors</textarea>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="multicolumn-toggle" />
    <label for="multicolumn-toggle">Multi-column</label>
  </div>
  <div class="field" id="separator-field" style="display:none">
    <label>Column separator</label>
    <input type="text" id="column-separator" value="|" />
  </div>

  <hr class="divider">
  <h2>Parameters</h2>
  <div class="params-grid" id="params-grid"></div>

  <div style="display:flex; gap:8px;">
    <button id="generate-btn" style="flex:1">Generate</button>
    <button id="batch-open-btn" style="flex:1">Label list (<span id="batch-count">0</span>)</button>
  </div>
  <button id="download-batch-btn">Download 3MF</button>
  <div id="status"></div>
  <button id="advanced-open-btn" class="btn-secondary">Advanced</button>
</div>

<div id="preview"></div>

<div id="batch-modal" style="display:none">
  <div id="batch-backdrop"></div>
  <div id="batch-dialog">
    <h1>Label list</h1>
    <div id="batch-list"></div>
    <div style="display:flex; gap:8px;">
      <button id="batch-add-btn" class="btn-secondary" style="flex:1">+ Add label</button>
      <button id="batch-clear-btn" class="btn-secondary" style="flex:1">Clear all</button>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="batch-generate-btn" style="flex:1">Generate preview</button>
      <button id="batch-close-btn" class="btn-secondary" style="flex:1">Cancel</button>
    </div>
  </div>
</div>

<div id="advanced-modal" style="display:none">
  <div id="advanced-backdrop"></div>
  <div id="advanced-dialog">
    <h1>Advanced</h1>
    <hr class="divider">
    <div class="field">
      <label>Font sampler</label>
      <p style="font-size:0.8rem;color:#888;margin-bottom:6px">Generate one label per font (regular + bold) using the font name as text.</p>
      <button id="font-sampler-btn">Generate font sampler</button>
    </div>
    <button id="advanced-close-btn" class="btn-secondary">Close</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/static/app.js"></script>

</body>
</html>
