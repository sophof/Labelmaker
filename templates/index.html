<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label Maker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; height: 100vh; background: #1a1a1a; color: #eee; }

    #sidebar {
      width: 300px; min-width: 300px; padding: 24px;
      background: #242424; display: flex; flex-direction: column; gap: 16px;
      overflow-y: auto;
    }
    h1 { font-size: 1.2rem; color: #fff; }
    h2 { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #aaa; }
    input[type="text"], input[type="number"], select, textarea {
      background: #333; border: 1px solid #444; color: #eee;
      padding: 6px 10px; border-radius: 4px; font-size: 0.95rem; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #888; }
    textarea { resize: vertical; font-family: inherit; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; }
    .checkbox-row input[type="checkbox"] { width: auto; accent-color: #2563eb; }
    .checkbox-row label { font-size: 0.8rem; color: #aaa; margin: 0; }
    select option { background: #333; }

    .divider { border: none; border-top: 1px solid #333; margin: 4px 0; }

    .params-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }

    button {
      border: none; padding: 10px; border-radius: 6px; font-size: 0.95rem; cursor: pointer;
    }
    #generate-btn { background: #2563eb; color: #fff; }
    #generate-btn:hover { background: #1d4ed8; }
    #generate-btn:disabled { background: #444; cursor: default; }

    #download-btn {
      display: none; text-align: center; text-decoration: none;
      background: #16a34a; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem;
    }
    #download-btn:hover { background: #15803d; }

    #status { font-size: 0.8rem; color: #aaa; min-height: 1.2em; }
    #status.warning { color: #f59e0b; }

    #preview { flex: 1; }
    canvas { display: block; }
  </style>
</head>
<body>

<div id="sidebar">
  <h1>Label Maker</h1>

  <div class="field">
    <label>System</label>
    <select id="system-select" onchange="onSystemChange()"></select>
  </div>
  <div class="field">
    <label>Box type</label>
    <select id="box-select" onchange="onBoxChange()"></select>
  </div>
  <div class="field" id="style-field">
    <label>Label style</label>
    <select id="style-select" onchange="onStyleChange()"></select>
  </div>

  <hr class="divider">
  <h2>Label text</h2>
  <div class="field">
    <textarea id="text" rows="2">Resistors</textarea>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="multicolumn-toggle" onchange="onMulticolumnToggle()" />
    <label for="multicolumn-toggle">Multi-column</label>
  </div>
  <div class="field" id="separator-field" style="display:none">
    <label>Column separator</label>
    <input type="text" id="column-separator" value="|" />
  </div>

  <hr class="divider">
  <h2>Parameters</h2>
  <div class="params-grid" id="params-grid"></div>

  <button id="generate-btn" onclick="generate()">Generate</button>
  <a id="download-btn" download>Download 3MF</a>
  <div id="status"></div>
</div>

<div id="preview"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- 3D preview setup ---
const container = document.getElementById('preview');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x1a1a1a);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
camera.position.set(0, -80, 60);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(1, -1, 2);
scene.add(dir);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let meshBase = null, meshText = null;

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(container);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

const loader = new STLLoader();
const matBase = new THREE.MeshPhongMaterial({ color: 0xffffff });
const matText = new THREE.MeshPhongMaterial({ color: 0x000000 });

window.loadSTLs = function(baseUrl, textUrl, baseColor, textColor) {
  if (meshBase) { scene.remove(meshBase); meshBase = null; }
  if (meshText) { scene.remove(meshText); meshText = null; }

  matBase.color.set(baseColor);
  matText.color.set(textColor);

  loader.load(baseUrl, geo => {
    geo.computeBoundingBox();
    const center = new THREE.Vector3();
    geo.boundingBox.getCenter(center);
    geo.translate(-center.x, -center.y, -center.z);
    meshBase = new THREE.Mesh(geo, matBase);
    scene.add(meshBase);

    if (textUrl) {
      loader.load(textUrl, geoT => {
        geoT.translate(-center.x, -center.y, -center.z);
        meshText = new THREE.Mesh(geoT, matText);
        scene.add(meshText);
      });
    }
  });
};

// --- System/box/style data ---
let systemsData = [];
let boxParams = {}; // fixed dimensions from the box YAML, passed to generate automatically
const BOX_PARAM_KEYS = new Set(['width', 'height', 'depth']);

async function loadSystems() {
  const res = await fetch('/systems');
  systemsData = await res.json();

  const sysSelect = document.getElementById('system-select');
  sysSelect.innerHTML = systemsData.map(s =>
    `<option value="${s.id}">${s.name}</option>`
  ).join('');
  onSystemChange();
}

window.onSystemChange = function() {
  const sysId = document.getElementById('system-select').value;
  const sys = systemsData.find(s => s.id === sysId);
  const boxSelect = document.getElementById('box-select');
  boxSelect.innerHTML = (sys?.boxes || []).map(b =>
    `<option value="${b.id}">${b.name}</option>`
  ).join('');
  onBoxChange();
};

window.onBoxChange = function() {
  const sysId = document.getElementById('system-select').value;
  const boxId = document.getElementById('box-select').value;
  const sys = systemsData.find(s => s.id === sysId);
  const box = sys?.boxes.find(b => b.id === boxId);
  const labels = box?.labels || [];
  const styleSelect = document.getElementById('style-select');
  styleSelect.innerHTML = labels.map(l =>
    `<option value="${l.style}">${l.style_name}</option>`
  ).join('');
  document.getElementById('style-field').style.display = labels.length > 1 ? '' : 'none';
  onStyleChange();
};

window.onStyleChange = function() {
  const sysId = document.getElementById('system-select').value;
  const boxId = document.getElementById('box-select').value;
  const styleId = document.getElementById('style-select').value;
  const sys = systemsData.find(s => s.id === sysId);
  const box = sys?.boxes.find(b => b.id === boxId);
  const label = box?.labels.find(l => l.style === styleId);
  renderParams(label?.params || {});
};

function renderParams(params) {
  boxParams = {};
  for (const [key, p] of Object.entries(params)) {
    if (BOX_PARAM_KEYS.has(key)) boxParams[key] = p.value ?? p.default;
  }

  const grid = document.getElementById('params-grid');
  grid.innerHTML = Object.entries(params).filter(([key]) => !BOX_PARAM_KEYS.has(key) && key !== 'column_separator').map(([key, p]) => {
    const unitLabel = p.unit ? ` (${p.unit})` : '';
    const fullWidth = p.type === 'str' ? ' style="grid-column: 1 / -1"' : '';
    let input;
    if (p.type === 'str' && p.options?.length) {
      const opts = p.options.map(o => `<option value="${o}"${o === p.value ? ' selected' : ''}>${o}</option>`).join('');
      input = `<select id="param-${key}">${opts}</select>`;
    } else if (p.type === 'str') {
      input = `<input type="text" id="param-${key}" value="${p.value}" />`;
    } else {
      input = `<input type="number" id="param-${key}" value="${p.value}" step="0.5" />`;
    }
    return `<div class="field"${fullWidth}><label>${p.label}${unitLabel}</label>${input}</div>`;
  }).join('');
}

function getParams() {
  const grid = document.getElementById('params-grid');
  const result = {};
  for (const el of grid.querySelectorAll('input, select')) {
    const key = el.id.replace('param-', '');
    result[key] = el.type === 'number' ? parseFloat(el.value) : el.value;
  }
  return result;
}

window.generate = async function() {
  const btn = document.getElementById('generate-btn');
  const status = document.getElementById('status');
  const dlBtn = document.getElementById('download-btn');

  btn.disabled = true;
  btn.textContent = 'Generating…';
  status.textContent = '';
  dlBtn.style.display = 'none';

  try {
    const styleId = document.getElementById('style-select').value;
    const separator = document.getElementById('multicolumn-toggle').checked
      ? document.getElementById('column-separator').value
      : '';
    const body = {
      text: document.getElementById('text').value,
      style: styleId,
      params: { ...boxParams, ...getParams(), column_separator: separator },
    };

    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || res.statusText);
    }

    const data = await res.json();
    window.loadSTLs(data.base_stl_url, data.text_stl_url, data.base_color, data.text_color);
    dlBtn.href = data['3mf_url'];
    dlBtn.style.display = 'block';
    if (data.warnings?.length) {
      status.className = 'warning';
      status.textContent = data.warnings.join(' · ');
    } else {
      status.className = '';
      status.textContent = 'Done.';
    }
  } catch (e) {
    status.className = '';
    status.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate';
  }
};

window.onMulticolumnToggle = function() {
  const on = document.getElementById('multicolumn-toggle').checked;
  document.getElementById('separator-field').style.display = on ? '' : 'none';
};

loadSystems();
</script>

</body>
</html>
